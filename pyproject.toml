[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-remediate"
version = "1.0.0"
description = "Autonomous DevSecOps Vulnerability Remediation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "langgraph>=0.2.0",
    "pytest>=7.0.0",
    "PyGithub>=2.0.0"
]

[project.scripts]
devsecops-remediate = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "gateway*", "sandbox*"]
exclude = ["demo_repo*", "tests*"]

[tool.setuptools]
py-modules = ["cli", "state", "workflow"]